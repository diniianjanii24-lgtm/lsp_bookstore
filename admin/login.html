<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #0d6efd 0%, #669dbb 100%); min-height: 100vh; }
        .login-card { max-width: 400px; margin: auto; }
    </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center min-vh-100" id="main"></div>
<script src="../assets/js/app.js"></script>
<script>

if (App.isAdmin()) { App.redirect('index.html'); }
var main = document.getElementById('main');
function render(errors) {
    main.innerHTML = '<div class="card login-card shadow-sm"><div class="card-header text-center bg-dark text-white">' +
        '<h4 class="mb-0"><i class="bi bi-shield-lock"></i> Admin Login</h4></div><div class="card-body">' +
        (errors.length ? '<div class="alert alert-danger">' + errors.map(function (e) { return '<div>' + e + '</div>'; }).join('') + '</div>' : '') +
        '<form id="admForm" novalidate>' +
        '<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" placeholder="admin@bookstore.com" required autofocus></div>' +
        '<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>' +
        '<button type="submit" class="btn btn-primary w-100">Login</button></form>' +
        '<div class="text-center mt-3"><small><a href="../login.html">Login sebagai user</a></small></div></div></div>';
    document.getElementById('admForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = this.email.value.trim(), pw = this.password.value;
        if (!email || !pw) { render(['Email dan password wajib diisi.']); return; }
        var adm = App.db().users.filter(function (u) { return u.role === 'admin' && u.email.toLowerCase() === email.toLowerCase(); })[0];
        if (adm && adm.password === App.hashPw(pw)) { App.login(adm); App.redirect('index.html'); return; }
        render(['Email atau password salah, atau akun bukan admin.']);
    });
}
render([]);

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
