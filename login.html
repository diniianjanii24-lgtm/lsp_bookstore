<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>
<main class="container my-4" id="main"></main>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {

App.layout(false);
var main = document.getElementById('main');

if (App.isLoggedIn()) { App.redirect('index.html'); return; }
function render(errors) {
    main.innerHTML = '<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card shadow-sm">' +
        '<div class="card-header text-center bg-primary text-white"><h4 class="mb-0"><i class="bi bi-person-circle"></i> Login</h4></div><div class="card-body">' +
        App.alertList('danger', errors, false) +
        '<form id="loginForm" novalidate>' +
        '<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" placeholder="contoh@email.com" required autofocus></div>' +
        '<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="Password" required></div>' +
        '<button type="submit" class="btn btn-primary w-100">Login</button></form>' +
        '<div class="text-center mt-3"><small>Belum punya akun? <a href="register.html">Daftar sekarang</a></small></div>' +
        '<div class="text-center mt-2"><small><a href="admin/login.html">Login sebagai Admin</a></small></div></div></div></div></div>';
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = this.email.value.trim(), pw = this.password.value, errs = [];
        if (!email) errs.push('Email wajib diisi.');
        if (!pw) errs.push('Password wajib diisi.');
        if (!errs.length) {
            var user = App.db().users.filter(function (u) { return u.email.toLowerCase() === email.toLowerCase(); })[0];
            if (user && user.password === App.hashPw(pw)) {
                App.login(user);
                App.setFlash('message', 'Login berhasil! Selamat belanja di Bookstore.');
                App.redirect('index.html');
                return;
            }
            errs.push('Email atau password salah.');
        }
        render(errs);
    });
}
render([]);

})();
</script>
</body>
</html>
