<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>
<main class="container my-4" id="main"></main>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {

App.layout(false);
var main = document.getElementById('main');

var id = parseInt(new URLSearchParams(location.search).get('id'), 10) || 0;
if (id <= 0) { App.redirect('index.html'); return; }
var book = App.byId(App.db().books, id);
if (!book) { App.setFlash('message', 'Buku tidak ditemukan.'); App.redirect('index.html'); return; }

main.innerHTML = '<div class="row"><div class="col-md-4">' +
    '<img src="' + App.imgSrc(book.image) + '" class="img-fluid rounded shadow-sm" alt="' + App.esc(book.title) + '"></div>' +
    '<div class="col-md-8"><h1 class="mb-3">' + App.esc(book.title) + '</h1>' +
    '<p class="text-muted"><i class="bi bi-person"></i> Penulis: <strong>' + App.esc(book.author) + '</strong></p>' +
    '<p class="text-muted"><i class="bi bi-folder"></i> Kategori: <strong>' + App.esc(App.catName(book.category_id)) + '</strong></p>' +
    '<h3 class="book-price my-4">' + App.rp(book.price) + '</h3>' +
    '<div class="my-4"><h5>Deskripsi</h5><p>' + App.nl2br(book.description) + '</p></div>' +
    '<form id="addForm" class="d-flex align-items-center gap-3">' +
    '<input type="number" name="quantity" value="1" min="1" class="form-control" style="max-width: 80px;">' +
    '<button type="submit" class="btn btn-primary"><i class="bi bi-cart-plus"></i> Tambah ke Keranjang</button></form>' +
    (!App.isLoggedIn() ? '<div class="alert alert-info mt-3 mb-0"><a href="login.html" class="alert-link fw-bold">Login</a> untuk proses checkout yang lebih cepat.</div>' : '') +
    '<a href="index.html" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Kembali</a></div></div>';

document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var qty = parseInt(this.quantity.value, 10) || 1;
    if (qty < 1) qty = 1;
    var cart = App.sess().cart;
    if (cart[book.id]) cart[book.id].quantity += qty;
    else cart[book.id] = { book_id: book.id, title: book.title, price: book.price, quantity: qty };
    App.saveSess();
    App.setFlash('message', 'Buku berhasil ditambahkan ke keranjang!');
    App.redirect('cart.html');
});

})();
</script>
</body>
</html>
