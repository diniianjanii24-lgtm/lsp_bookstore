<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>
<main class="container my-4" id="main"></main>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {

App.layout(false);
var main = document.getElementById('main');

var q = new URLSearchParams(location.search);
var search = (q.get('search') || '').trim();
var category = parseInt(q.get('category'), 10) || 0;
var d = App.db();
var cats = d.categories.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
var books = d.books.filter(function (b) {
    if (search && b.title.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
    if (category > 0 && b.category_id != category) return false;
    return true;
}).sort(function (a, b) { return a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : a.id - b.id; });

var html = '<div class="row mb-4"><div class="col-12">' +
    '<form method="GET" action="index.html" class="d-flex gap-2">' +
    '<input type="text" name="search" class="form-control" placeholder="Cari buku..." value="' + App.esc(search) + '">' +
    '<select name="category" class="form-select" onchange="this.form.submit()"><option value="0">Semua Kategori</option>' +
    cats.map(function (c) { return '<option value="' + c.id + '"' + (category == c.id ? ' selected' : '') + '>' + App.esc(c.name) + '</option>'; }).join('') +
    '</select><button type="submit" class="btn btn-outline-light"><i class="bi bi-search"></i> Cari</button></form></div></div>';

var flash = App.getFlash('message');
if (flash) html += '<div class="alert alert-success alert-dismissible fade show flash-message" role="alert">' + flash +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';

if (books.length) {
    html += '<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">' + books.map(function (b) {
        return '<div class="col"><div class="card book-card h-100">' +
            '<img src="' + App.imgSrc(b.image) + '" class="book-img card-img-top" alt="' + App.esc(b.title) + '">' +
            '<div class="card-body d-flex flex-column"><h6 class="card-title">' + App.esc(b.title) + '</h6>' +
            '<p class="book-meta mb-1"><i class="bi bi-person"></i> ' + App.esc(b.author) + '</p>' +
            '<p class="book-meta mb-2"><i class="bi bi-folder"></i> ' + App.esc(App.catName(b.category_id)) + '</p>' +
            '<div class="mt-auto d-flex justify-content-between align-items-center">' +
            '<span class="book-price">' + App.rp(b.price) + '</span>' +
            '<a href="detail.html?id=' + b.id + '" class="btn btn-sm btn-outline-primary">Detail</a></div></div></div></div>';
    }).join('') + '</div>';
} else {
    html += '<div class="text-center py-5"><i class="bi bi-book display-1 text-muted"></i><p class="text-muted mt-3">Tidak ada buku ditemukan.</p></div>';
}
main.innerHTML = html;

})();
</script>
</body>
</html>
