<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div id="site-header"></div>
<div class="container-fluid my-4" id="main"></div>
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
if (!App.isAdmin()) { App.redirect("login.html"); return; }
App.layout(true);
var main = document.getElementById('main');

var d = App.db();
function stat(icon, color, n, label) {
    return '<div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">' +
        '<i class="bi bi-' + icon + ' display-4 text-' + color + ' mb-2"></i><h2 class="fw-bold">' + n + '</h2><p class="text-muted mb-0">' + label + '</p></div></div></div>';
}
main.innerHTML = '<div class="row mb-4"><div class="col-12"><h1 class="mb-3"><i class="bi bi-speedometer2"></i> Dashboard</h1>' +
    '<p class="text-muted">Selamat datang, <strong>' + App.esc(App.getUserName()) + '</strong></p></div></div>' +
    '<div class="row g-3 mb-4">' + stat('book', 'primary', d.books.length, 'Buku') + stat('folder', 'info', d.categories.length, 'Kategori') +
    stat('person-circle', 'success', d.users.length, 'Pengguna') + stat('receipt', 'warning', d.orders.length, 'Pesanan') + '</div>' +
    '<div class="row"><div class="col-12"><div class="card shadow-sm"><div class="card-header"><h5 class="mb-0"><i class="bi bi-lightbulb"></i> Quick Actions</h5></div>' +
    '<div class="card-body"><a href="books.html" class="btn btn-outline-primary">Kelola Buku</a> ' +
    '<a href="categories.html" class="btn btn-outline-info">Kelola Kategori</a> ' +
    '<a href="orders.html" class="btn btn-outline-warning">Lihat Pesanan</a> ' +
    '<a href="../logout.html" class="btn btn-outline-secondary">Keluar</a></div></div></div></div>';

})();
</script>
</body>
</html>
